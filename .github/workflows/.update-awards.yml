name: Update Awards and Deploy

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Save previous data snapshot
        run: cp award-site/awards-data.js /tmp/previous-awards-data.js

      - name: Fetch latest award records
        run: >
          python nehs-awards/scripts/update_awards.py
          --output award-site/awards-data.js

      - name: Record update history
        run: >
          python nehs-awards/scripts/record_update_history.py
          --previous /tmp/previous-awards-data.js
          --current award-site/awards-data.js
          --history award-site/update-history.json

      - name: Commit updated data and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add award-site/awards-data.js award-site/update-history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update award records $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - name: Prepare website
        run: |
          mkdir -p _site
          cp -R award-site _site/award-site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
